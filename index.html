<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HERE Digital Cockpit China</title>
    <meta
      name="description"
      content="HERE Technologies 中国 - 为汽车制造商和企业提供统一的实时地图解决方案与位置数据服务。"
    />

    <link rel="icon" type="image/svg+xml" href="/src/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" as="image" href="src/digital-cockpit-hero-2.jpg" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-container">
        <a href="./" class="navbar-logo" aria-label="HERE Home">
          <img src="src/logo.svg" alt="HERE Logo" />
        </a>

        <button
          class="navbar-toggle"
          id="navbarToggle"
          aria-label="Toggle Navigation"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="navbar-menu" id="navbarMenu" aria-label="Main Navigation">
          <ul class="navbar-links">
            <li><a href="./" class="navbar-link">主页</a></li>
            <li><a href="digital-cockpit/" class="navbar-link">数字座舱</a></li>
            <li><a href="blog/" class="navbar-link">Lotus Emeya + HERE</a></li>
          </ul>
        </nav>
        <div class="navbar-actions">
          <a href="contact/" class="btn btn-cta" id="contactCtaBtn">联系我们</a>
        </div>
      </div>
    </header>

    <section
      class="hero-section dc-hero"
      style="background-image: url(&quot;src/digital-cockpit-hero-2.jpg&quot;)"
    >
      <div class="hero-overlay">
        <div class="container hero-content">
          <h1 class="hero-title">面向汽车制造商和企业的统一地图</h1>
          <a href="contact/" class="btn btn-primary hero-cta" id="contact-btn"
            >联系我们</a
          >
        </div>
      </div>
    </section>

    <!-- ============================================================
         VIDEO SECTION 1
         Layout modeled on here.com/scenextract-demo-landing-page:
         contained media box + copy/CTAs side-by-side, NOT full-bleed.
         - Real asset in place: src/videos/feature-video-1.mp4
           (compressed from the original 339MB/HEVC 1080p source to
           ~15MB H.264 960x540 — HEVC has patchy support in Android/
           WeChat in-app browsers common for a Baidu campaign audience,
           so re-encoding to H.264 was necessary, not just a size cut).
         - poster="src/scenextract-poster.jpg" is the client-supplied
           thumbnail (map data → mesh → rendered scene, 3-panel), center-
           cropped from its native 3:2 to the box's 16:9 (only trims the
           decorative teal border top/bottom, no content lost).
         - Media box aspect-ratio is 16:9 (native), not cropped 4:3 —
           the source has on-screen Chinese/English text overlays, so
           cropping to 4:3 risked cutting off copy at the edges.
         - If the mp4 fails to load, main.js keeps the poster visible
           and hides the play control so nothing looks broken.
         - Headline, body copy, and "立即观看" button are client-approved
           (CN copy provided). Single CTA only — secondary link removed.
         ============================================================ -->
    <section class="video-card-section" id="video-section-1">
      <div class="container video-card-inner">
        <h2 class="video-card-title">SceneXtract：开启仿真与测试的新可能</h2>

        <div class="video-card-row">
          <div
            class="video-card-media"
            id="videoCardMedia1"
            tabindex="0"
            role="button"
            aria-label="播放视频"
          >
            <video
              id="video1"
              muted
              playsinline
              preload="metadata"
              poster="src/scenextract-poster.jpg"
            >
              <source src="src/videos/feature-video-1.mp4" type="video/mp4" />
            </video>
            <span class="video-card-play" aria-hidden="true">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </span>
          </div>

          <div class="video-card-text">
            <p class="video-card-desc"
              >了解HERE如何实现汽车级质量的快速仿真。SceneXtract将AWS生成式AI搜索能力与HERE高精度实时地图相结合，帮助OEM和Tier1供应商在几分钟内生成测试场景。</p
            >
            <div class="video-card-actions">
              <button
                type="button"
                class="video-card-btn-primary"
                data-video-play="videoCardMedia1"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path d="M8 5v14l11-7z" />
                </svg>
                立即观看
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="contact-global-section">
      <div class="contact-global-content">
        <h2 class="contact-global-title">联系我们</h2>
        <p class="contact-global-subheading"
          >一起探讨如何将位置智能融入您的解决方案。</p
        >
        <a
          href="contact/"
          id="footer-contact-btn"
          class="contact-global-btn"
          style="display: inline-block; text-decoration: none"
          >联系我们</a
        >
      </div>
    </section>

    <footer class="global-footer">
      <div class="footer-main">
        <div class="footer-brand">
          <p class="heading-2 text-ondarkcolor-primary">HERE</p>
        </div>
        <div class="footer-qr-wrap">
          <img
            src="src/wechat-qr.png"
            alt="WeChat QR Code"
            class="footer-qr-img"
          />
          <span class="footer-qr-caption">扫码关注</span>
        </div>
      </div>
    </footer>

    <footer class="footer">
      &copy; 2025 HERE Technologies. 保留所有权利。
      <span style="margin: 0 10px">|</span>
      <a href="privacy/" style="color: inherit; text-decoration: none"
        >隐私政策</a
      >
    </footer>

    <script src="main.js"></script>
    <script type="text/javascript">
      (function () {
        var didInit = false;
        function initMunchkin() {
          if (didInit === false) {
            didInit = true;
            Munchkin.init("142-UEL-347");
          }
        }
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.async = true;
        s.src = "//munchkin.marketo.net/munchkin.js";
        s.onreadystatechange = function () {
          if (this.readyState == "complete" || this.readyState == "loaded") {
            initMunchkin();
          }
        };
        s.onload = initMunchkin;
        document.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>
  </body>
</html>
