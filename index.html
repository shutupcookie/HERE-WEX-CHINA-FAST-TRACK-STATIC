<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HERE Digital Cockpit China</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://go.engage.here.com/js/forms2/js/forms2.min.js"></script>
    <link rel="preload" as="image" href="src/digital-cockpit-hero-2.jpg">
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-container">
        <a href="./" class="navbar-logo" aria-label="HERE Home">
          <img src="src/logo.svg" alt="HERE Logo" />
        </a>

        <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle Navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="navbar-menu" id="navbarMenu" aria-label="Main Navigation">
          <ul class="navbar-links">
            <li><a href="./" class="navbar-link">主页</a></li>
            <li><a href="digital-cockpit/" class="navbar-link">数字座舱</a></li>
            <li><a href="blog/" class="navbar-link">Lotus Emeya + HERE</a></li>
          </ul>
        </nav>
        <div class="navbar-actions">
          <a href="#" class="btn btn-cta" id="contactCtaBtn">联系我们</a>
        </div>
      </div>
    </header>

    <section
      class="hero-section dc-hero"
      style="background-image: url('src/digital-cockpit-hero-2.jpg')"
    >
      <div class="hero-overlay">
        <div class="container hero-content">
          <h1 class="hero-title">面向汽车制造商和企业的统一地图</h1>
          <a href="#" class="btn btn-primary hero-cta" id="contact-btn">联系我们</a>
        </div>
      </div>
    </section>

    <section class="feature-section">
      <div class="feature-content">
        <h2 class="text-headline font-bold mb-6">一张地图，多种解决方案</h2>
        <p class="text-body opacity-80">
          HERE 统一实时地图为跨行业及多种应用场景的企业提供车规级位置数据。
        </p>
      </div>
    </section>

    <section class="contact-global-section">
      <div class="contact-global-content">
        <h2 class="contact-global-title">联系我们</h2>
        <p class="contact-global-subheading">一起探讨如何将位置智能融入您的解决方案。</p>
        <button id="footer-contact-btn" class="contact-global-btn">联系我们</button>
      </div>
    </section>

    <footer class="global-footer">
      <div class="footer-main">
        <div class="footer-brand">
          <p class="heading-2 text-ondarkcolor-primary">HERE</p>
        </div>
        <div class="footer-qr-wrap">
          <img
            src="src/wechat-qr.png"
            alt="WeChat QR Code"
            class="footer-qr-img"
          />
          <span class="footer-qr-caption">扫码关注</span>
        </div>
      </div>
    </footer>

    <footer class="footer">
      &copy; 2025 HERE Technologies. 保留所有权利。 
      <span style="margin: 0 10px;">|</span> 
      <a href="privacy/" style="color: inherit; text-decoration: none;">隐私政策</a>
    </footer>

    <script src="main.js"></script>
    <script type="text/javascript">
      (function () {
        var didInit = false;
        function initMunchkin() {
          if (didInit === false) {
            didInit = true;
            Munchkin.init("142-UEL-347");
          }
        }
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.async = true;
        s.src = "//munchkin.marketo.net/munchkin.js";
        s.onreadystatechange = function () {
          if (this.readyState == "complete" || this.readyState == "loaded") {
            initMunchkin();
          }
        };
        s.onload = initMunchkin;
        document.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>
  </body>
</html>
